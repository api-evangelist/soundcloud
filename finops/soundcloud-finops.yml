principles:
- name: Visibility
  description: Track API usage via internal logs; consumer subscriptions are billed separately.
- name: Allocation
  description: Allocate creator tooling subscriptions (Artist Pro, Pro Unlimited) to the team or artist that owns the SoundCloud account.
- name: Optimization
  description: Cache stream URLs and metadata; avoid burning play-count quota on duplicate requests.
- name: Accountability
  description: Single team owns the SoundCloud app credentials and any creator subscriptions.
