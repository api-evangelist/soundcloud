description: >-
  FOCUS-aligned FinOps profile for SoundCloud. The API itself has no per-call charge for approved
  partners; cost concentration is on the consumer subscription side (Go, Go+, Artist Pro, Pro
  Unlimited) and on creator tooling. Treat the API as a free dependency once approved.
notes: API is free; consumer/creator subscriptions are billed separately by SoundCloud.
